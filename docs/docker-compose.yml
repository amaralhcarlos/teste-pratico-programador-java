services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: VR
      RABBITMQ_DEFAULT_PASS: software

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

volumes:
  rabbitmq_data:
